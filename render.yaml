services:
  - type: web
    name: baithak-cafe
    rootDir: backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: CLIENT_ORIGIN
        value: https://your-render-domain.onrender.com
