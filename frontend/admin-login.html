<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Baithak Cafe | Admin Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="admin-login-body">
  <main class="admin-login-card">
    <a class="brand" href="index.html"><span class="brand-mark"><img class="brand-logo" src="assets/logo.jpg" alt="Baithak Cafe logo"><span class="brand-fallback" hidden>B</span></span><span><strong>Baithak Cafe</strong><small>Admin portal</small></span></a>
    <p class="eyebrow">Private workspace</p>
    <h1>Admin sign in</h1>
    <p class="login-copy">Sign in to manage orders, menu items, categories, and store settings.</p>
    <form id="admin-login-form"><label>Password<input id="admin-password" type="password" autocomplete="current-password" required autofocus></label><p id="login-error" class="login-error" hidden></p><button class="checkout-button" type="submit">Sign in <span>→</span></button></form>
    <a class="back-to-store" href="index.html">← Back to customer store</a>
  </main>
  <script src="admin-login.js"></script>
</body>
</html>
